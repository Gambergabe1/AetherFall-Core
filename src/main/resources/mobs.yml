# ── Bosses ────────────────────────────────────────────────────
# abilities: nova (area damage + effect), minions, leap, fireballs, teleport, webs, lightning
# phases:    at = health fraction; enrage multiplies damage & speed and speeds up abilities
# rewards:   coin pool shared by damage dealt; loot rolled for every player who did >= 5% damage
bosses:
  frost_titan:
    base: ZOMBIE
    name: "Frost Titan"
    color: "<aqua><bold>"
    health: 900
    damage: 14
    speed: 0.24
    scale: 2.6
    bar: BLUE
    summon-item: frozen_relic
    equipment: { helmet: frost_helmet, chestplate: frost_chestplate, leggings: frost_leggings, boots: frost_boots, mainhand: frostbite_blade }
    abilities:
      - { type: nova, every: 9, radius: 7, damage: 8, effect: slowness, particle: SNOWFLAKE }
      - { type: leap, every: 7, radius: 4, damage: 10 }
      - { type: minions, every: 20, mob: frost_zombie, count: 3 }
    phases:
      - { at: 0.5, enrage: 1.3, message: "The Titan's armor cracks — it grows furious!" }
    rewards:
      coins: 6000
      loot: [ { item: frostite, chance: 1.0, min: 8, max: 20 }, { item: enchanted_diamond, chance: 0.35 }, { item: frostbite_blade, chance: 0.04 }, { item: aether_shard, chance: 0.5, min: 1, max: 3 } ]
  ember_warlord:
    base: WITHER_SKELETON
    name: "Ember Warlord"
    color: "<red><bold>"
    health: 1200
    damage: 16
    speed: 0.28
    scale: 2.0
    bar: RED
    summon-item: ember_sigil
    equipment: { mainhand: ember_blade, helmet: ember_helmet, chestplate: ember_chestplate }
    abilities:
      - { type: fireballs, every: 6 }
      - { type: nova, every: 10, radius: 6, damage: 7, effect: fire, particle: FLAME }
      - { type: minions, every: 22, mob: ember_skeleton, count: 3 }
    phases:
      - { at: 0.4, enrage: 1.35, message: "The Warlord erupts in flame!" }
    rewards:
      coins: 8000
      loot: [ { item: emberite, chance: 1.0, min: 10, max: 24 }, { item: ember_core, chance: 1.0, min: 2, max: 5 }, { item: ember_blade, chance: 0.05 }, { item: ember_pickaxe, chance: 0.04 } ]
  broodmother:
    base: SPIDER
    name: "The Broodmother"
    color: "<dark_green><bold>"
    health: 700
    damage: 12
    speed: 0.32
    scale: 3.0
    bar: GREEN
    summon-item: silk_cocoon
    abilities:
      - { type: webs, every: 11 }
      - { type: nova, every: 8, radius: 6, damage: 5, effect: poison, particle: ITEM_SLIME }
      - { type: minions, every: 15, mob: venom_spider, count: 4 }
    phases:
      - { at: 0.5, enrage: 1.25, message: "The Broodmother shrieks — her children answer!" }
    rewards:
      coins: 5000
      loot: [ { item: spider_silk, chance: 1.0, min: 8, max: 16 }, { item: enchanted_string, chance: 0.5, min: 1, max: 2 }, { item: grappling_hook, chance: 0.15 } ]
  void_herald:
    base: ENDERMAN
    name: "Void Herald"
    color: "<dark_purple><bold>"
    health: 1600
    damage: 18
    speed: 0.3
    scale: 1.6
    bar: PURPLE
    summon-item: void_sigil
    abilities:
      - { type: teleport, every: 6 }
      - { type: nova, every: 9, radius: 7, damage: 9, effect: blindness, particle: PORTAL }
      - { type: minions, every: 20, mob: shadow_stalker, count: 2 }
    phases:
      - { at: 0.5, enrage: 1.3, message: "Reality tears around the Herald!" }
      - { at: 0.2, enrage: 1.2, message: "The Herald becomes desperate!" }
    rewards:
      coins: 12000
      loot: [ { item: voidstone, chance: 1.0, min: 4, max: 10 }, { item: void_fragment, chance: 1.0, min: 16, max: 32 }, { item: void_blade, chance: 0.04 }, { item: void_chestplate, chance: 0.06 } ]
  infernal_tyrant:
    base: BLAZE
    name: "Infernal Tyrant"
    color: "<gradient:#FF5A1F:#B22222><bold>"
    health: 2500
    damage: 18
    scale: 3.0
    bar: RED
    summon-item: infernal_sigil
    abilities:
      - { type: fireballs, every: 4 }
      - { type: nova, every: 8, radius: 8, damage: 9, effect: fire, particle: FLAME }
      - { type: lightning, every: 11, damage: 9 }
      - { type: minions, every: 20, mob: infernal_brute, count: 2 }
    phases:
      - { at: 0.5, enrage: 1.3, message: "The Tyrant's flames turn white-hot!" }
      - { at: 0.2, enrage: 1.2, message: "The Tyrant is burning out — finish it!" }
    rewards:
      coins: 20000
      loot: [ { item: infernium, chance: 1.0, min: 16, max: 32 }, { item: soulite, chance: 1.0, min: 4, max: 10 }, { item: soulreaper, chance: 0.05 }, { item: infernal_chestplate, chance: 0.08 } ]
  aether_colossus:
    base: ZOMBIE
    name: "Aether Colossus"
    color: "<gradient:#8B5CF6:#22D3EE><bold>"
    health: 5000
    damage: 20
    speed: 0.22
    scale: 4.0
    bar: PINK
    world-boss: true
    equipment: { helmet: starlight_helmet, chestplate: starlight_chestplate, leggings: starlight_leggings, boots: starlight_boots }
    abilities:
      - { type: lightning, every: 7, damage: 10 }
      - { type: leap, every: 9, radius: 6, damage: 14 }
      - { type: nova, every: 12, radius: 9, damage: 10, effect: slowness, particle: END_ROD }
      - { type: minions, every: 25, mob: cave_brute, count: 4 }
    phases:
      - { at: 0.66, enrage: 1.2, message: "The Colossus awakens fully!" }
      - { at: 0.33, enrage: 1.3, message: "The Colossus begins to crumble — finish it!" }
    rewards:
      coins: 25000
      loot: [ { item: starlight, chance: 0.8, min: 1, max: 3 }, { item: aether_shard, chance: 1.0, min: 3, max: 8 }, { item: echo_heart, chance: 0.03 }, { item: sunken_treasure, chance: 0.5 } ]

# A World Boss appears at the arena (set with /aether setarena) on a timer when enough players are online.
world-boss:
  boss: aether_colossus
  interval-minutes: 180
  min-players: 3
  warning-minutes: 5
