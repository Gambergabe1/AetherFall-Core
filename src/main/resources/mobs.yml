# ─────────────────────────────────────────────────────────────
#  Elite mobs replace a share of natural spawns; bosses are summoned with relics from /forge
#  or appear as timed World Boss events. /aether reload applies changes.
#
#  replace:   which natural spawns can become this elite (types, chance, optional biome / y filters)
#  on-hit:    effects applied to players the mob hits (effect names = potion effects, plus "fire")
#  equipment: item keys (custom ids or vanilla materials); never dropped
#  drops:     rolled on death (in addition to vanilla drops); coins go straight to the killer
# ─────────────────────────────────────────────────────────────

