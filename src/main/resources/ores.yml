# ─────────────────────────────────────────────────────────────
#  Custom ores generated underground in the overworld. Every chunk is populated once
#  (new and existing chunks), only replacing natural stone, so builds are never touched.
#  block      what the ore looks like (only naturally generated ones count as ore)
#  drop       custom item id; min/max amount, Fortune adds more
#  y          [min, max] height;  veins = attempts per chunk;  chance = chance per attempt
#  tool       minimum pickaxe tier: WOOD, STONE, IRON, DIAMOND, NETHERITE (custom tools count as their base)
# ─────────────────────────────────────────────────────────────
version: 1
replaceable: [STONE, DEEPSLATE, TUFF, ANDESITE, DIORITE, GRANITE]
ores:
  mithril:   { block: OXIDIZED_CUT_COPPER,      drop: mithril,     min: 1, max: 3, y: [-16, 48],  veins: 4, chance: 0.9,  size: [3, 7], tool: IRON,    xp: 3 }
  titanium:  { block: WHITE_GLAZED_TERRACOTTA,  drop: titanium,    min: 1, max: 2, y: [-48, 16],  veins: 3, chance: 0.7,  size: [2, 5], tool: DIAMOND, xp: 5 }
  frostite:  { block: BLUE_ICE,                 drop: frostite,    min: 1, max: 2, y: [-40, 24],  veins: 2, chance: 0.6,  size: [2, 5], tool: IRON,    xp: 5 }
  emberite:  { block: GILDED_BLACKSTONE,        drop: emberite,    min: 1, max: 2, y: [-64, -24], veins: 2, chance: 0.6,  size: [2, 5], tool: DIAMOND, xp: 6 }
  voidstone: { block: CRYING_OBSIDIAN,          drop: voidstone,   min: 1, max: 1, y: [-64, -44], veins: 1, chance: 0.45, size: [1, 3], tool: DIAMOND, xp: 10 }
  starlight: { block: SEA_LANTERN,              drop: starlight,   min: 1, max: 1, y: [-64, -40], veins: 1, chance: 0.12, size: [1, 2], tool: DIAMOND, xp: 20 }
  # Nether & End
  infernium: { block: RAW_COPPER_BLOCK, drop: infernium, min: 1, max: 3, y: [10, 118], veins: 5, chance: 0.8, size: [3, 6], tool: IRON, xp: 6, dimension: NETHER, replace: [NETHERRACK] }
  soulite:   { block: LIGHT_BLUE_GLAZED_TERRACOTTA, drop: soulite, min: 1, max: 2, y: [5, 70], veins: 2, chance: 0.6, size: [2, 4], tool: DIAMOND, xp: 10, dimension: NETHER, replace: [SOUL_SAND, SOUL_SOIL, BASALT, BLACKSTONE] }
  astralite: { block: AMETHYST_BLOCK, drop: astralite, min: 1, max: 2, y: [0, 90], veins: 3, chance: 0.7, size: [2, 5], tool: DIAMOND, xp: 12, dimension: THE_END, replace: [END_STONE] }
