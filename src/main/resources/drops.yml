# ─────────────────────────────────────────────────────────────
#  Rare drops. chance is 0..1. Looting/Fortune/Luck of the Sea add +20% chance per level,
#  the Lucky Charm adds +25%, the Angler's Rod doubles fishing chances.
#  Drops rarer than rare-drop-announce are announced to the whole server.
# ─────────────────────────────────────────────────────────────
rare-drop-announce: 0.01

mobs:
  ZOMBIE:           [ { item: zombie_heart, chance: 0.008 } ]
  ZOMBIE_VILLAGER:  [ { item: zombie_heart, chance: 0.02 } ]
  HUSK:             [ { item: zombie_heart, chance: 0.01 } ]
