# ─────────────────────────────────────────────────────────────
#  /bazaar — a player-driven order book for MATERIALS (like Hypixel's).
#  • Sell offers: list items at your price; buyers take the cheapest first. Coins go straight to your purse.
#  • Buy orders: pre-pay coins; sellers fill the highest first. Claim items in "Manage Orders".
#  • Instant buy/sell trade against the best existing orders. tax is taken from every sale (coin sink).
#  Gear (weapons, armor, tools, talismans, relics) can't be listed here — it goes to the Auction House (/ah).
#
#  Category tree: category → groups → groups → … (any depth). Any node may have `products` and/or `groups`.
#  A group with a single product opens that product directly. Product keys: lowercase = custom, UPPERCASE = vanilla.
#  `pane` is the coloured glass frame for the whole category.
# ─────────────────────────────────────────────────────────────
tax: 0.0125
max-orders: 21
max-amount: 10240
min-price: 0.1
max-price: 100000000

