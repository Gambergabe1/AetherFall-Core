# ─────────────────────────────────────────────────────────────
#  Aetherfall custom items. Add your own freely — /aether reload applies changes.
#
#  material   vanilla base item (textures come from it; no resource pack needed)
#  type       RESOURCE, ENCHANTED, TOOL, WEAPON, BOW, TALISMAN, CONSUMABLE
#  rarity     COMMON, UNCOMMON, RARE, EPIC, LEGENDARY, MYTHIC
#  recipe     crafted in /forge. Ingredient keys: lowercase = custom item id, UPPERCASE = vanilla item
#  ability    built-in behaviours: prospector, drill, excavate, autosmelt, replenish, woodsman, grapple,
#             sea_luck, heal, frostbite, ember, teleport, lifesteal, starfall, triple_shot, feast, treasure, wisdom
#  effects    TALISMAN: potion effects while carried (amplifier 0 = level I)
#  sell       NPC sell price used by /shop when the item isn't listed in shop.yml
# ─────────────────────────────────────────────────────────────

items:
  # ── Mining resources (from custom ores) ─────────────────────
  mithril:          { material: PRISMARINE_CRYSTALS, name: "Mithril", rarity: UNCOMMON, type: RESOURCE, sell: 12, lore: ["A shimmering teal metal found", "between Y -16 and 48."] }
  titanium:         { material: QUARTZ, name: "Titanium", rarity: RARE, type: RESOURCE, sell: 30, lore: ["Incredibly strong and light.", "Found between Y -48 and 16."] }
